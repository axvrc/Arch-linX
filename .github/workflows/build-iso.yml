name: Build and Upload Arch-linX ISO

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso sudo

      - name: Build ISO
        run: |
          mkdir -p out work
          sudo mkarchiso -v -w ./work -o ./out ./archiso

      - name: Upload ISO to transfer.sh
        id: upload
        run: |
          iso_file=$(ls ./out/*.iso | head -n 1)
          echo "Subiendo $(basename "$iso_file") a transfer.sh..."
          url=$(curl --upload-file "$iso_file" "https://transfer.sh/$(basename "$iso_file")")
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "=================================="
          echo "URL de descarga: $url"
          echo "=================================="

      - name: Mostrar URL de descarga
        run: |
          echo "Descarga la ISO desde: ${{ steps.upload.outputs.url }}"
